# Catppuccin Latte theme for tmux

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#e6e9ef,fg=#4c4f69"
set -g status-left-length 50
set -g status-right-length 100
set -g status-left "#[bg=#1e66f5,fg=#e6e9ef,bold] #S #[bg=#e6e9ef,fg=#1e66f5]"
set -g status-right "#[fg=#6c6f85]#{?client_prefix,#[fg=#d20f39]PREFIX ,}#[fg=#8839ef]#(whoami)@#H #[fg=#1e66f5]%H:%M "

# Window status
set -g window-status-format "#[fg=#6c6f85] #I:#W "
set -g window-status-current-format "#[bg=#ccd0da,fg=#4c4f69] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#ccd0da"
set -g pane-active-border-style "fg=#1e66f5"

# Message styling
set -g message-style "bg=#ccd0da,fg=#4c4f69"
set -g message-command-style "bg=#ccd0da,fg=#4c4f69"

# Mode styling
set -g mode-style "bg=#bcc0cc,fg=#4c4f69"
