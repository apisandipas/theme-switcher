font_family      Victor Mono
bold_font         Victor Mono
italic_font         Victor Mono Italic
bold_italic_font    Victor Mono Bold Italic
adjust_column_width     95%
background_opacity .95
font_size 14.0
#font_features VictorMono-Medium +ss01

enable_audio_bell no
window_padding_width 10

# Disable ligatures on cursor hover
disable_ligatures cursor

# Catppuccin Latte
foreground               #4c4f69
background               #eff1f5
selection_foreground     #eff1f5
selection_background     #acb0be

cursor                   #dc8a78
cursor_text_color        #eff1f5

url_color                #1e66f5

active_tab_foreground    #eff1f5
active_tab_background    #8839ef
inactive_tab_foreground  #4c4f69
inactive_tab_background  #9ca0b0

active_border_color      #8839ef
inactive_border_color    #ccd0da

