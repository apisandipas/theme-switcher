# Catppuccin Mocha theme for tmux

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 50
set -g status-right-length 100
set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#cba6f7]"
set -g status-right "#[fg=#6c7086]#{?client_prefix,#[fg=#f38ba8]PREFIX ,}#[fg=#89b4fa]#(whoami)@#H #[fg=#cba6f7]%H:%M "

# Window status
set -g window-status-format "#[fg=#6c7086] #I:#W "
set -g window-status-current-format "#[bg=#313244,fg=#cdd6f4] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# Message styling
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"

# Mode styling
set -g mode-style "bg=#45475a,fg=#cdd6f4"
