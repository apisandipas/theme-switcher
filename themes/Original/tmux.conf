# Rosé Pine Moon theme for tmux

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#232136,fg=#e0def4"
set -g status-left-length 50
set -g status-right-length 100
set -g status-left "#[bg=#3e8fb0,fg=#232136,bold] #S #[bg=#232136,fg=#3e8fb0]"
set -g status-right "#[fg=#6e6a86]#{?client_prefix,#[fg=#eb6f92]PREFIX ,}#[fg=#c4a7e7]#(whoami)@#H #[fg=#3e8fb0]%H:%M "

# Window status
set -g window-status-format "#[fg=#6e6a86] #I:#W "
set -g window-status-current-format "#[bg=#393552,fg=#e0def4] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#44415a"
set -g pane-active-border-style "fg=#3e8fb0"

# Message styling
set -g message-style "bg=#393552,fg=#e0def4"
set -g message-command-style "bg=#393552,fg=#e0def4"

# Mode styling
set -g mode-style "bg=#44415a,fg=#e0def4"
