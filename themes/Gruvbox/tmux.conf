# Gruvbox Dark theme for tmux

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#282828,fg=#ebdbb2"
set -g status-left-length 50
set -g status-right-length 100
set -g status-left "#[bg=#b8bb26,fg=#282828,bold] #S #[bg=#282828,fg=#b8bb26]"
set -g status-right "#[fg=#928374]#{?client_prefix,#[fg=#fb4934]PREFIX ,}#[fg=#83a598]#(whoami)@#H #[fg=#b8bb26]%H:%M "

# Window status
set -g window-status-format "#[fg=#928374] #I:#W "
set -g window-status-current-format "#[bg=#3c3836,fg=#ebdbb2] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#b8bb26"

# Message styling
set -g message-style "bg=#3c3836,fg=#ebdbb2"
set -g message-command-style "bg=#3c3836,fg=#ebdbb2"

# Mode styling
set -g mode-style "bg=#504945,fg=#ebdbb2"
