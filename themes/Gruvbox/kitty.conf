font_family      Victor Mono
bold_font         Victor Mono
italic_font         Victor Mono Italic
bold_italic_font    Victor Mono Bold Italic
adjust_column_width     95%
background_opacity .5
font_size 14.0
#font_features VictorMono-Medium +ss01

enable_audio_bell no
window_padding_width 10

# Disable ligatures on cursor hover
disable_ligatures cursor

# Gruvbox Dark
foreground               #ebdbb2
background               #282828
selection_foreground     #282828
selection_background     #ebdbb2

cursor                   #ebdbb2
cursor_text_color        #282828

url_color                #83a598

active_tab_foreground    #282828
active_tab_background    #b8bb26
inactive_tab_foreground  #ebdbb2
inactive_tab_background  #3c3836

active_border_color      #b8bb26
inactive_border_color    #504945

