font_family      Victor Mono
bold_font         Victor Mono
italic_font         Victor Mono Italic
bold_italic_font    Victor Mono Bold Italic
adjust_column_width     95%
background_opacity .5
font_size 14.0
#font_features VictorMono-Medium +ss01

enable_audio_bell no
window_padding_width 10

# Disable ligatures on cursor hover
disable_ligatures cursor

# Nord
foreground               #d8dee9
background               #2e3440
selection_foreground     #d8dee9
selection_background     #434c5e

cursor                   #d8dee9
cursor_text_color        #2e3440

url_color                #88c0d0

active_tab_foreground    #2e3440
active_tab_background    #88c0d0
inactive_tab_foreground  #d8dee9
inactive_tab_background  #3b4252

active_border_color      #88c0d0
inactive_border_color    #4c566a

