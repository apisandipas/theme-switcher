# Nord theme for tmux

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#2e3440,fg=#d8dee9"
set -g status-left-length 50
set -g status-right-length 100
set -g status-left "#[bg=#88c0d0,fg=#2e3440,bold] #S #[bg=#2e3440,fg=#88c0d0]"
set -g status-right "#[fg=#4c566a]#{?client_prefix,#[fg=#bf616a]PREFIX ,}#[fg=#81a1c1]#(whoami)@#H #[fg=#88c0d0]%H:%M "

# Window status
set -g window-status-format "#[fg=#4c566a] #I:#W "
set -g window-status-current-format "#[bg=#3b4252,fg=#d8dee9] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#88c0d0"

# Message styling
set -g message-style "bg=#3b4252,fg=#d8dee9"
set -g message-command-style "bg=#3b4252,fg=#d8dee9"

# Mode styling
set -g mode-style "bg=#434c5e,fg=#d8dee9"
